name: Redmi 9A - Inspect Original Boot

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            xxd \
            cpio \
            gzip \
            lz4 \
            zstd \
            unzip \
            binwalk

      - name: Download original boot.img
        run: |
          mkdir -p input

          BOOT_URL="https://github.com/JBofficial-tech/kernelSu_redmi9a/releases/download/v1.0/boot.img"

          echo "===== DOWNLOADING BOOT.IMG ====="
          echo "$BOOT_URL"

          curl -L --fail --retry 3 \
            "$BOOT_URL" \
            -o input/boot.img

          echo
          echo "===== DOWNLOADED FILE ====="
          ls -lh input/boot.img
          file input/boot.img

      - name: Verify boot image
        run: |
          echo "===== BOOT IMAGE HEADER ====="

          xxd -l 64 input/boot.img

          echo
          echo "===== FILE TYPE ====="
          file input/boot.img

          echo
          echo "===== SHA256 ====="
          sha256sum input/boot.img

      - name: Parse Android boot image
        run: |
          mkdir -p extracted

          python3 - <<'PY'
          import struct
          import os

          path = "input/boot.img"

          with open(path, "rb") as f:
              boot = f.read()

          if boot[:8] != b"ANDROID!":
              raise SystemExit("ERROR: ANDROID! header not found")

          print("ANDROID boot image: VALID")

          kernel_size = struct.unpack_from("<I", boot, 8)[0]
          kernel_addr = struct.unpack_from("<I", boot, 12)[0]
          ramdisk_size = struct.unpack_from("<I", boot, 16)[0]
          ramdisk_addr = struct.unpack_from("<I", boot, 20)[0]
          second_size = struct.unpack_from("<I", boot, 24)[0]
          second_addr = struct.unpack_from("<I", boot, 28)[0]
          tags_addr = struct.unpack_from("<I", boot, 32)[0]
          page_size = struct.unpack_from("<I", boot, 36)[0]

          print("Kernel size :", kernel_size)
          print("Kernel addr :", hex(kernel_addr))
          print("Ramdisk size:", ramdisk_size)
          print("Ramdisk addr:", hex(ramdisk_addr))
          print("Second size :", second_size)
          print("Page size   :", page_size)

          def align(value, alignment):
              return ((value + alignment - 1) // alignment) * alignment

          kernel_offset = page_size
          ramdisk_offset = kernel_offset + align(kernel_size, page_size)

          kernel = boot[
              kernel_offset:
              kernel_offset + kernel_size
          ]

          ramdisk = boot[
              ramdisk_offset:
              ramdisk_offset + ramdisk_size
          ]

          with open("extracted/kernel.bin", "wb") as f:
              f.write(kernel)

          with open("extracted/ramdisk.bin", "wb") as f:
              f.write(ramdisk)

          print()
          print("Kernel extracted:", len(kernel), "bytes")
          print("Ramdisk extracted:", len(ramdisk), "bytes")
          print("Kernel offset:", kernel_offset)
          print("Ramdisk offset:", ramdisk_offset)
          PY

      - name: Inspect kernel
        run: |
          echo "===== KERNEL ====="
          file extracted/kernel.bin
          ls -lh extracted/kernel.bin

          echo
          echo "===== KERNEL MAGIC ====="
          xxd -l 32 extracted/kernel.bin

          echo
          echo "===== KERNEL STRINGS ====="

          strings -a extracted/kernel.bin \
            > extracted/kernel.strings

          echo
          echo "===== VERSION / DEVICE / COMPILER ====="

          grep -Ei \
            'Linux version|4\.19|4\.9|clang|gcc|dandelion|angelica|blossom|redmi|xiaomi|perf' \
            extracted/kernel.strings \
            | head -200 || true

      - name: Search embedded kernel config
        run: |
          echo "===== EMBEDDED CONFIG ====="

          grep -Ei \
            'IKCONFIG|CONFIG_[A-Z0-9_]+=|KSU|KERNELSU' \
            extracted/kernel.strings \
            | head -300 \
            > extracted/config-results.txt || true

          cat extracted/config-results.txt

      - name: Inspect ramdisk
        run: |
          echo "===== RAMDISK ====="
          file extracted/ramdisk.bin
          ls -lh extracted/ramdisk.bin

          echo
          echo "===== RAMDISK MAGIC ====="
          xxd -l 16 extracted/ramdisk.bin

      - name: Extract ramdisk when possible
        run: |
          mkdir -p extracted/ramdisk

          if file extracted/ramdisk.bin | grep -qi 'gzip compressed'; then
            echo "gzip ramdisk detected"
            gzip -dc extracted/ramdisk.bin \
              | (cd extracted/ramdisk && cpio -idm --no-absolute-filenames) \
              || true

          elif file extracted/ramdisk.bin | grep -qi 'ASCII cpio'; then
            echo "cpio ramdisk detected"
            (cd extracted/ramdisk && cpio -idm --no-absolute-filenames) \
              < extracted/ramdisk.bin \
              || true

          elif file extracted/ramdisk.bin | grep -qi 'LZ4'; then
            echo "LZ4 ramdisk detected"
            lz4 -dc extracted/ramdisk.bin \
              | (cd extracted/ramdisk && cpio -idm --no-absolute-filenames) \
              || true

          elif file extracted/ramdisk.bin | grep -qi 'Zstandard'; then
            echo "ZSTD ramdisk detected"
            zstd -dc extracted/ramdisk.bin \
              | (cd extracted/ramdisk && cpio -idm --no-absolute-filenames) \
              || true

          else
            echo "Unknown ramdisk format"
          fi

          echo
          echo "===== RAMDISK FILES ====="
          find extracted/ramdisk -maxdepth 3 -type f \
            | sort \
            | head -200 || true

      - name: Create final report
        run: |
          {
            echo "======================================"
            echo " REDMI 9A ORIGINAL BOOT INSPECTION"
            echo "======================================"
            echo

            echo "BOOT IMAGE:"
            file input/boot.img
            ls -lh input/boot.img

            echo
            echo "BOOT SHA256:"
            sha256sum input/boot.img

            echo
            echo "KERNEL:"
            file extracted/kernel.bin
            ls -lh extracted/kernel.bin

            echo
            echo "KERNEL SHA256:"
            sha256sum extracted/kernel.bin

            echo
            echo "VERSION / DEVICE / COMPILER:"
            grep -Ei \
              'Linux version|4\.19|4\.9|clang|gcc|dandelion|angelica|blossom|redmi|xiaomi|perf' \
              extracted/kernel.strings \
              | head -200 || true

            echo
            echo "KERNEL CONFIG / KERNELSU:"
            cat extracted/config-results.txt

          } > extracted/REPORT.txt

          echo
          echo "======================================"
          cat extracted/REPORT.txt
          echo "======================================"

      - name: Upload inspection results
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-Boot-Inspection
          path: extracted/
