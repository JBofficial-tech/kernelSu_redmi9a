name: Redmi 9A - KernelSU v0.9.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl jq bc bison flex build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 rsync cpio \
            device-tree-compiler unzip gzip

      # ---------------------------------------------------------
      # KERNEL SOURCE
      # ---------------------------------------------------------

      - name: Clone kernel source
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

          test -f kernel/Makefile
          test -d kernel/drivers
          test -d kernel/arch

      - name: Verify kernel source
        working-directory: kernel
        run: |
          echo "===== KERNEL SOURCE ====="
          git log -1 --oneline
          make kernelversion

      # ---------------------------------------------------------
      # FIND DEFCONFIG
      # ---------------------------------------------------------

      - name: Find device defconfig
        working-directory: kernel
        run: |
          set -e

          echo "===== AVAILABLE ARM64 DEFCONFIGS ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | grep -Ei 'blossom|dandelion|mt6765|angelica' \
            || true

          CONFIG=""

          for cfg in \
            angelica_defconfig \
            dandelion_defconfig \
            blossom_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Device defconfig was not found."
            exit 1
          fi

          echo "Using: $CONFIG"
          echo "KERNEL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Generate base config
        working-directory: kernel
        run: |
          set -e

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

      # ---------------------------------------------------------
      # KERNELSU 0.9.5
      # ---------------------------------------------------------

      - name: Install EXACT KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e

          echo "===== INSTALL KERNELSU v0.9.5 ====="

          curl -L --fail \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh \
            -o /tmp/setup-ksu.sh

          chmod +x /tmp/setup-ksu.sh

          # IMPORTANT:
          # Explicitly pass v0.9.5.
          # Do NOT allow setup.sh to select latest KernelSU.
          /tmp/setup-ksu.sh v0.9.5

          test -d drivers/kernelsu

          echo
          echo "===== KERNELSU VERSION ====="

          cd drivers/kernelsu

          git describe --tags --always 2>/dev/null || true

          grep -R \
            -m1 \
            -E 'VERSION|KSU_VERSION' \
            Makefile \
            ../kernelsu/Makefile \
            2>/dev/null || true

      # ---------------------------------------------------------
      # VERIFY KSU SOURCE
      # ---------------------------------------------------------

      - name: Verify KernelSU integration
        working-directory: kernel
        run: |
          set -e

          echo "===== KSU DIRECTORY ====="
          ls -la drivers/kernelsu

          echo
          echo "===== KSU KCONFIG ====="
          grep -n -A20 -B5 \
            '^config KSU' \
            drivers/kernelsu/Kconfig || true

          echo
          echo "===== DRIVER KCONFIG ENTRY ====="
          grep -n \
            'drivers/kernelsu/Kconfig' \
            drivers/Kconfig

          echo
          echo "===== DRIVER MAKEFILE ENTRY ====="
          grep -n \
            'kernelsu' \
            drivers/Makefile

      # ---------------------------------------------------------
      # KPROBES
      # ---------------------------------------------------------

      - name: Enable KPROBES requirements
        working-directory: kernel
        run: |
          set -e

          echo "===== ENABLE KPROBES REQUIREMENTS ====="

          ./scripts/config \
            --file out/.config \
            --enable MODULES

          ./scripts/config \
            --file out/.config \
            --enable KPROBES

          ./scripts/config \
            --file out/.config \
            --enable KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable KALLSYMS

          ./scripts/config \
            --file out/.config \
            --enable EXT4_FS

          echo
          echo "===== BEFORE OLDDEFCONFIG ====="

          ./scripts/config --file out/.config --state MODULES
          ./scripts/config --file out/.config --state KPROBES
          ./scripts/config --file out/.config --state KPROBE_EVENTS
          ./scripts/config --file out/.config --state KALLSYMS
          ./scripts/config --file out/.config --state EXT4_FS

      - name: Apply olddefconfig
        working-directory: kernel
        run: |
          set -e

          echo "===== OLDDEFCONFIG ====="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      # ---------------------------------------------------------
      # FORCE KSU AFTER OLDDEFCONFIG
      # ---------------------------------------------------------

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          set -e

          echo "===== ENABLE KSU ====="

          ./scripts/config \
            --file out/.config \
            --enable MODULES

          ./scripts/config \
            --file out/.config \
            --enable KPROBES

          ./scripts/config \
            --file out/.config \
            --enable KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable KALLSYMS

          ./scripts/config \
            --file out/.config \
            --enable EXT4_FS

          ./scripts/config \
            --file out/.config \
            --enable KSU

          echo
          echo "===== KSU CONFIG BEFORE FINAL OLDDEFCONFIG ====="

          ./scripts/config \
            --file out/.config \
            --state KSU

          ./scripts/config \
            --file out/.config \
            --state KPROBES

          ./scripts/config \
            --file out/.config \
            --state MODULES

      - name: Final configuration
        working-directory: kernel
        run: |
          set -e

          echo "===== FINAL OLDDEFCONFIG ====="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            '^CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KALLSYMS|EXT4_FS|KSU)=' \
            out/.config || true

          echo
          echo "===== FINAL STATES ====="

          ./scripts/config --file out/.config --state MODULES
          ./scripts/config --file out/.config --state KPROBES
          ./scripts/config --file out/.config --state KPROBE_EVENTS
          ./scripts/config --file out/.config --state KSU

          if ! grep -q '^CONFIG_MODULES=y' out/.config; then
            echo "ERROR: CONFIG_MODULES=y missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_KPROBES=y' out/.config; then
            echo "ERROR: CONFIG_KPROBES=y missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "ERROR: CONFIG_KSU=y missing"
            exit 1
          fi

          echo
          echo "======================================"
          echo " MODULES  = y"
          echo " KPROBES  = y"
          echo " KSU      = y"
          echo " CONFIGURATION OK"
          echo "======================================"

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------

      - name: Build KernelSU kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "===== BUILD KERNEL ====="

          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz

      - name: Verify kernel build
        working-directory: kernel
        run: |
          set -e

          echo "===== VERIFY BUILD ====="

          test -s out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz

          echo
          echo "===== BUILD SUCCESS ====="

      # ---------------------------------------------------------
      # PREPARE ARTIFACT
      # ---------------------------------------------------------

      - name: Prepare kernel artifact
        run: |
          set -e

          mkdir -p output

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            output/KernelSU-Image.gz

          cp \
            kernel/out/.config \
            output/kernel-config

          sha256sum \
            output/KernelSU-Image.gz \
            > output/SHA256SUMS.txt

      - name: Upload KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU-v0.9.5
          path: output/
