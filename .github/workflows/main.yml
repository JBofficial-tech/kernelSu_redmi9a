name: Build KernelSU for Redmi 9A (dandelion)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Build Dependencies & Python 2
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev tar wget libelf-dev python2 python2-minimal
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup Proton Clang & GCC Toolchains
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Checkout Kernel Source (4.19 Tree)
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss kernel_src || \
          git clone --depth=1 https://github.com/dandelion-devs/android_kernel_xiaomi_dandelion -b 4.19 kernel_src

      - name: Patch Python Shebangs in DCT Tools
        run: |
          cd kernel_src
          if [ -d "tools/dct" ]; then
            find tools/dct -type f -name "*.py" -exec sed -i 's|#!/usr/bin/env python$|#!/usr/bin/env python2|g' {} +
            find tools/dct -type f -name "*.py" -exec sed -i 's|#!/usr/bin/python$|#!/usr/bin/python2|g' {} +
          fi

      - name: Integrate KernelSU
        run: |
          cd kernel_src
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          DEFCONFIG="arch/arm64/configs/dandelion_defconfig"
          [ -f "$DEFCONFIG" ] || DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          cd kernel_src
          export PATH="$(pwd)/../clang/bin:$(pwd)/../gcc64/bin:$(pwd)/../gcc32/bin:$PATH"
          mkdir out
          
          DEFCONFIG="dandelion_defconfig"
          [ -f "arch/arm64/configs/$DEFCONFIG" ] || DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" -exec basename {} \; | head -n 1)
          
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- $DEFCONFIG
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- KCFLAGS="-w"

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp kernel_src/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb 2>/dev/null || cp kernel_src/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz 2>/dev/null || cp kernel_src/out/arch/arm64/boot/Image AnyKernel3/Image 2>/dev/null
          
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=KernelSU for Redmi 9A by Tech Mind/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=.*;|block=/dev/block/by-name/boot;|g' anykernel.sh
          
          chmod -R 755 tools/ *.sh
          zip -r9 ../KernelSU-Redmi9A-Flashable.zip ./* -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Redmi9A-Flashable
          path: KernelSU-Redmi9A-Flashable.zip
