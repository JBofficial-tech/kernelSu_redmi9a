name: Redmi 9A KernelSU Build

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            libncurses5-dev libncurses-dev \
            python3 rsync cpio zip unzip \
            wget curl device-tree-compiler

      - name: Show toolchain
        run: |
          echo "===== HOST CLANG ====="
          clang --version

          echo "===== ARM64 GCC ====="
          aarch64-linux-gnu-gcc --version | head -1

          echo "===== LLD ====="
          ld.lld --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/zyexro/sashimi_kernel_xiaomi_blossom.git \
            kernel

      - name: Check source
        working-directory: kernel
        run: |
          echo "===== COMMIT ====="
          git log -1 --oneline

          echo "===== KERNEL VERSION ====="
          make kernelversion

      - name: Find defconfig
        working-directory: kernel
        run: |
          echo "===== DEVICE CONFIGS ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -iname "*dandelion*" \
              -o -iname "*blossom*" \
              -o -iname "*angelican*" \
              -o -iname "*mt6765*" \
            \) \
            -print

      - name: Prepare config
        working-directory: kernel
        run: |
          mkdir -p out

          if [ -f arch/arm64/configs/dandelion_defconfig ]; then
            echo "Using dandelion_defconfig"
            make O=out ARCH=arm64 \
              dandelion_defconfig

          elif [ -f arch/arm64/configs/blossom_defconfig ]; then
            echo "Using blossom_defconfig"
            make O=out ARCH=arm64 \
              blossom_defconfig

          elif [ -f arch/arm64/configs/angelican_defconfig ]; then
            echo "Using angelican_defconfig"
            make O=out ARCH=arm64 \
              angelican_defconfig

          else
            echo "ERROR: No suitable defconfig found"
            exit 1
          fi

      - name: Clone KernelSU Next
        run: |
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

      - name: Integrate KernelSU
        working-directory: kernel
        run: |
          ../KernelSU-Next/kernel/setup.sh

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          make O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== KSU ====="
          grep CONFIG_KSU out/.config || true

      - name: Build scripts
        working-directory: kernel
        run: |
          make -C out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            REAL_CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            V=1 \
            scripts

      - name: Build kernel
        working-directory: kernel
        run: |
          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            REAL_CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            Image.gz

      - name: Collect output
        run: |
          mkdir -p output

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz \
              output/Image.gz
          fi

          cp kernel/out/.config \
            output/kernel-config

          echo "===== BUILD OUTPUT ====="
          ls -lah output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU
          path: output/
