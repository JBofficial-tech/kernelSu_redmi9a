name: Redmi 9A - KernelSU Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 rsync cpio \
            device-tree-compiler

      - name: Clone verified Niigo kernel
        run: |
          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

      - name: Verify kernel tree
        working-directory: kernel
        run: |
          test -f Makefile
          test -d arch
          test -d drivers
          test -d include

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== SOURCE COMMIT ====="
          git log -1 --oneline

      - name: Find device config
        working-directory: kernel
        run: |
          echo "===== AVAILABLE CONFIGS ====="

          find arch/arm64/configs \
            -type f \
            | grep -Ei 'blossom|dandelion|mt6765' \
            | head -50

          CONFIG=""

          for cfg in \
            blossom_defconfig \
            dandelion_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Redmi 9A/Blossom defconfig not found."
            exit 1
          fi

          echo "Using: $CONFIG"
          echo "KERNEL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

      - name: Integrate KernelSU
        working-directory: kernel
        run: |
          echo "===== INSTALLING KERNELSU ====="

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -

          echo
          echo "===== KERNELSU FILES ====="

          test -d drivers/kernelsu || \
            test -d drivers/ksu || \
            {
              echo "ERROR: KernelSU integration directory not found."
              exit 1
            }

      - name: Enable KernelSU configuration
        working-directory: kernel
        run: |
          echo "===== CONFIGURING KERNELSU ====="

          if [ ! -f scripts/config ]; then
            echo "ERROR: scripts/config not found."
            exit 1
          fi

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBES

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KALLSYMS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      - name: Verify KernelSU configuration
        working-directory: kernel
        run: |
          echo "===== KSU CONFIG ====="

          grep '^CONFIG_KSU=' out/.config || {
            echo "ERROR: CONFIG_KSU is not enabled."
            exit 1
          }

          grep '^CONFIG_KPROBES=' out/.config || true
          grep '^CONFIG_KPROBE_EVENTS=' out/.config || true
          grep '^CONFIG_KALLSYMS=' out/.config || true

          echo
          echo "KernelSU configuration verified."

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz

      - name: Verify final kernel
        working-directory: kernel
        run: |
          echo "===== FINAL KERNEL ====="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== KERNEL VERSION ====="
          make O=out ARCH=arm64 kernelversion

          echo
          echo "===== KSU CONFIG ====="
          grep '^CONFIG_KSU=' out/.config

          echo
          echo "===== KSU STRINGS ====="
          strings out/arch/arm64/boot/Image.gz \
            | grep -i 'kernelsu\|kernelsu' \
            | head -20 || true

      - name: Prepare artifact
        run: |
          mkdir -p output

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            output/Image.gz

          cp \
            kernel/out/.config \
            output/kernel-config

          cp \
            kernel/Makefile \
            output/kernel-Makefile

          echo "KernelSU build completed." \
            > output/BUILD_SUCCESS.txt

          echo "===== OUTPUT ====="
          ls -lh output

      - name: Upload KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU
          path: output/
