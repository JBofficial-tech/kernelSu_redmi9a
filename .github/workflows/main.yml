name: Redmi 9A - KernelSU v0.9.5 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 rsync cpio \
            device-tree-compiler curl

      - name: Clone Niigo kernel
        run: |
          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

      - name: Verify kernel
        working-directory: kernel
        run: |
          test -f Makefile
          test -d arch
          test -d drivers
          test -d include

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== SOURCE ====="
          git log -1 --oneline

      - name: Find Redmi 9A defconfig
        working-directory: kernel
        run: |
          echo "===== AVAILABLE DEVICE CONFIGS ====="

          find arch/arm64/configs \
            -type f \
            | grep -Ei 'blossom|dandelion|mt6765' \
            | head -100

          CONFIG=""

          for cfg in \
            blossom_defconfig \
            dandelion_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Redmi 9A defconfig not found."
            exit 1
          fi

          echo "Using $CONFIG"
          echo "KERNEL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

      - name: Check Kprobe requirements
        working-directory: kernel
        run: |
          echo "===== KPROBE CONFIG ====="

          grep '^CONFIG_KPROBES=' out/.config || true
          grep '^CONFIG_HAVE_KPROBES=' out/.config || true
          grep '^CONFIG_KPROBE_EVENTS=' out/.config || true
          grep '^CONFIG_MODULES=' out/.config || true

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          echo "===== KERNELSU v0.9.5 ====="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

      - name: Verify KernelSU integration
        working-directory: kernel
        run: |
          echo "===== KERNELSU DIRECTORY ====="

          test -d drivers/kernelsu

          ls -la drivers/kernelsu

          echo
          echo "===== KCONFIG ENTRY ====="
          grep -n 'drivers/kernelsu/Kconfig' drivers/Kconfig

          echo
          echo "===== MAKEFILE ENTRY ====="
          grep -n 'CONFIG_KSU.*kernelsu' drivers/Makefile

          echo
          echo "===== KSU SYMBOL ====="
          grep -R -n \
            '^config KSU' \
            drivers/kernelsu \
            | head -20

      - name: Enable required configs
        working-directory: kernel
        run: |
          echo "===== ENABLING KPROBE ====="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBES

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_HAVE_KPROBES

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_MODULES

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KALLSYMS

          echo
          echo "===== CONFIG BEFORE OLDDEFCONFIG ====="

          grep -E \
            '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|MODULES|KALLSYMS)=' \
            out/.config \
            || true

      - name: Regenerate kernel config
        working-directory: kernel
        run: |
          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      - name: Verify KernelSU config
        working-directory: kernel
        run: |
          echo "===== FINAL CONFIG ====="

          grep -E \
            '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|MODULES|KALLSYMS)=' \
            out/.config \
            || true

          if grep -q '^CONFIG_KSU=y' out/.config; then
            echo
            echo "================================"
            echo "CONFIG_KSU=y SUCCESS"
            echo "================================"
          else
            echo
            echo "ERROR: CONFIG_KSU is still unavailable."
            echo
            echo "KSU Kconfig:"
            cat drivers/kernelsu/Kconfig || true
            echo
            echo "KSU Makefile:"
            cat drivers/kernelsu/Makefile || true
            exit 1
          fi

      - name: Build KernelSU kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz

      - name: Verify build
        working-directory: kernel
        run: |
          test -f out/arch/arm64/boot/Image.gz

          echo "===== BUILD SUCCESS ====="
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== KERNEL VERSION ====="
          make O=out ARCH=arm64 kernelversion

          echo
          echo "===== KSU ====="
          grep '^CONFIG_KSU=y' out/.config

      - name: Prepare artifact
        run: |
          mkdir -p output

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            output/Image.gz

          cp \
            kernel/out/.config \
            output/kernel-config

          cp \
            kernel/Makefile \
            output/kernel-Makefile

          echo "KernelSU v0.9.5 build successful." \
            > output/BUILD_SUCCESS.txt

          echo "===== ARTIFACT ====="
          ls -lh output

      - name: Upload KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU-v0.9.5
          path: output/
