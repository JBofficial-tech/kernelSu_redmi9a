name: Redmi 9A - KernelSU Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 rsync cpio \
            device-tree-compiler

      - name: Clone Niigo kernel
        run: |
          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

      - name: Verify kernel source
        working-directory: kernel
        run: |
          test -f Makefile
          test -d arch
          test -d drivers
          test -d include

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== SOURCE COMMIT ====="
          git log -1 --oneline

      - name: Find defconfig
        working-directory: kernel
        run: |
          echo "===== CONFIG FILES ====="

          find arch/arm64/configs \
            -type f \
            | grep -Ei 'blossom|dandelion|mt6765' \
            | head -50 || true

          CONFIG=""

          for cfg in \
            blossom_defconfig \
            dandelion_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Suitable defconfig not found."
            exit 1
          fi

          echo "Using $CONFIG"
          echo "KERNEL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

      - name: Download KernelSU
        working-directory: kernel
        run: |
          echo "===== DOWNLOADING KERNELSU ====="

          rm -rf drivers/kernelsu

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          chmod +x /tmp/ksu-setup.sh

          /tmp/ksu-setup.sh

      - name: Verify KernelSU source
        working-directory: kernel
        run: |
          echo "===== KERNELSU SOURCE ====="

          if [ -d drivers/kernelsu ]; then
            echo "drivers/kernelsu exists"
            find drivers/kernelsu -maxdepth 2 -type f | head -50
          else
            echo "ERROR: drivers/kernelsu was not created."
            exit 1
          fi

      - name: Register KernelSU in Kconfig
        working-directory: kernel
        run: |
          echo "===== REGISTERING KERNELSU ====="

          if grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo "KernelSU already registered."
          else
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> drivers/Kconfig
            echo "KernelSU Kconfig entry added."
          fi

          echo
          echo "===== CHECK ====="
          grep -n 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Check KernelSU Kconfig
        working-directory: kernel
        run: |
          echo "===== KSU CONFIG SYMBOLS ====="

          grep -R \
            -n \
            -E 'config KSU|CONFIG_KSU' \
            drivers/kernelsu \
            | head -50 || true

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          echo "===== ENABLING KSU ====="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBES

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KALLSYMS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      - name: Verify KSU configuration
        working-directory: kernel
        run: |
          echo "===== FINAL KSU CONFIG ====="

          if grep -q '^CONFIG_KSU=y' out/.config; then
            echo "CONFIG_KSU=y"
          else
            echo "ERROR: CONFIG_KSU was not enabled."
            echo
            echo "Relevant configuration:"
            grep -Ei 'KSU|KPROBE|KALLSYMS' out/.config || true
            exit 1
          fi

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz

      - name: Verify final kernel
        working-directory: kernel
        run: |
          echo "===== BUILD RESULT ====="

          test -f out/arch/arm64/boot/Image.gz

          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== KERNEL VERSION ====="
          make O=out ARCH=arm64 kernelversion

          echo
          echo "===== KSU ====="
          grep '^CONFIG_KSU=y' out/.config

      - name: Prepare artifact
        run: |
          mkdir -p output

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            output/Image.gz

          cp \
            kernel/out/.config \
            output/kernel-config

          echo "KernelSU build successful." \
            > output/BUILD_SUCCESS.txt

      - name: Upload KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU
          path: output/
