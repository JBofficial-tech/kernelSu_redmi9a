name: Redmi 9A - KernelSU Build and Boot Repack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl jq bc bison flex build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 rsync cpio \
            device-tree-compiler

      - name: Clone verified Niigo kernel
        run: |
          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

      - name: Verify kernel source
        working-directory: kernel
        run: |
          test -f Makefile
          test -d arch
          test -d drivers
          test -d include

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== SOURCE COMMIT ====="
          git log -1 --oneline

      - name: Find Redmi 9A defconfig
        working-directory: kernel
        run: |
          echo "===== AVAILABLE CONFIGS ====="

          find arch/arm64/configs \
            -type f \
            | grep -Ei 'blossom|dandelion|mt6765' \
            | head -100 || true

          CONFIG=""

          for cfg in \
            blossom_defconfig \
            dandelion_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Redmi 9A defconfig not found."
            exit 1
          fi

          echo "Using defconfig: $CONFIG"
          echo "KERNEL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          echo "===== INSTALLING KERNELSU v0.9.5 ====="

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          chmod +x /tmp/ksu-setup.sh

          /tmp/ksu-setup.sh

      - name: Verify KernelSU integration
        working-directory: kernel
        run: |
          echo "===== KERNELSU DIRECTORY ====="

          test -d drivers/kernelsu

          echo "drivers/kernelsu found."

          echo
          echo "===== KCONFIG ====="
          grep -n 'drivers/kernelsu/Kconfig' drivers/Kconfig || true

          echo
          echo "===== MAKEFILE ====="
          grep -n 'kernelsu' drivers/Makefile || true

          echo
          echo "===== KSU SYMBOL ====="
          grep -R -n '^config KSU' drivers/kernelsu || true

      - name: Enable KernelSU requirements
        working-directory: kernel
        run: |
          echo "===== ENABLE KSU REQUIREMENTS ====="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBES

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KALLSYMS

          ./scripts/config \
           
