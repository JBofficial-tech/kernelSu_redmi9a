name: Redmi 9A KernelSU - Diagnostic Build

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            python3 \
            rsync \
            cpio \
            zip \
            unzip \
            wget \
            curl \
            device-tree-compiler

      - name: Show compiler
        run: |
          echo "===== CLANG ====="
          clang --version

          echo "===== LLD ====="
          ld.lld --version

          echo "===== GCC ====="
          gcc --version | head -1

      - name: Clone Blossom kernel source
        run: |
          git clone --depth=1 \
            https://github.com/zyexro/sashimi_kernel_xiaomi_blossom.git \
            kernel

      - name: Check kernel source
        working-directory: kernel
        run: |
          echo "===== GIT ====="
          git log -1 --oneline

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo "===== TOP LEVEL ====="
          ls -la

      - name: Find Redmi defconfig
        working-directory: kernel
        run: |
          echo "===== POSSIBLE CONFIGS ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -iname "*dandelion*" \
              -o -iname "*blossom*" \
              -o -iname "*angelican*" \
              -o -iname "*mt6765*" \
            \) \
            -print

      - name: Prepare kernel config
        working-directory: kernel
        run: |
          mkdir -p out

          if [ -f arch/arm64/configs/dandelion_defconfig ]; then
            echo "Using dandelion_defconfig"
            make O=out ARCH=arm64 dandelion_defconfig

          elif [ -f arch/arm64/configs/blossom_defconfig ]; then
            echo "Using blossom_defconfig"
            make O=out ARCH=arm64 blossom_defconfig

          elif [ -f arch/arm64/configs/angelican_defconfig ]; then
            echo "Using angelican_defconfig"
            make O=out ARCH=arm64 angelican_defconfig

          else
            echo "ERROR: Redmi defconfig not found"
            exit 1
          fi

      - name: Clone KernelSU Next
        run: |
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

          echo "===== KERNELSU REVISION ====="
          cd KernelSU-Next
          git log -1 --oneline

      - name: Integrate KernelSU
        working-directory: kernel
        run: |
          if [ ! -f ../KernelSU-Next/kernel/setup.sh ]; then
            echo "ERROR: KernelSU setup.sh not found"
            exit 1
          fi

          ../KernelSU-Next/kernel/setup.sh

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          make O=out ARCH=arm64 olddefconfig

          echo "===== KSU CONFIG ====="
          grep -E 'CONFIG_KSU' out/.config || true

      - name: Diagnose scripts mod
        working-directory: kernel
        run: |
          set -o pipefail

          echo "========================================"
          echo "DIAGNOSTIC: scripts/mod/empty.o"
          echo "========================================"

          echo "===== COMPILER ====="
          clang --version

          echo "===== KERNEL VERSION ====="
          make O=out ARCH=arm64 kernelversion

          echo "===== BUILD empty.o WITH VERBOSE OUTPUT ====="

          make -C out \
            ARCH=arm64 \
            V=1 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            scripts/mod/empty.o

      - name: Stop after diagnostic
        run: |
          echo "Diagnostic completed."
          echo "The actual compiler output is above."
          echo "No kernel will be flashed by this workflow."
