name: Redmi 9A - Niigo Kernel Compatibility Test

on:
  workflow_dispatch:

jobs:
  verify-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 rsync cpio \
            device-tree-compiler

      - name: Clone Niigo kernel
        run: |
          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

      - name: Verify kernel tree
        working-directory: kernel
        run: |
          test -f Makefile
          test -d arch
          test -d drivers
          test -d include

          echo "Kernel source tree: OK"

          echo
          echo "===== VERSION ====="
          make kernelversion

          echo
          echo "===== HEAD ====="
          git log -1 --oneline

      - name: Check ARM64 configuration
        working-directory: kernel
        run: |
          echo "===== CONFIG FILES ====="

          find arch/arm64/configs \
            -type f \
            | grep -Ei 'blossom|dandelion|mt6765' \
            | head -50 || true

      - name: Prepare output
        working-directory: kernel
        run: |
          mkdir -p out

      - name: Detect suitable defconfig
        working-directory: kernel
        run: |
          CONFIG=""

          for cfg in \
            blossom_defconfig \
            dandelion_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "No obvious Blossom/MT6765 defconfig found."
            echo "Available configs:"
            find arch/arm64/configs -maxdepth 1 -type f | head -100
            exit 1
          fi

          echo "Using config: $CONFIG"
          echo "KERNEL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

      - name: Verify original kernel requirements
        working-directory: kernel
        run: |
          echo "===== REQUIRED CONFIG ====="

          for option in \
            CONFIG_ARM64 \
            CONFIG_MODULES \
            CONFIG_MODVERSIONS \
            CONFIG_KPROBES \
            CONFIG_KALLSYMS \
            CONFIG_FTRACE
          do
            grep "^$option=" out/.config || true
          done

      - name: Build test
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz

      - name: Verify kernel output
        working-directory: kernel
        run: |
          test -f out/arch/arm64/boot/Image.gz

          echo "===== BUILD SUCCESS ====="
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== KERNEL VERSION ====="
          make O=out ARCH=arm64 kernelversion

      - name: Upload test kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-Niigo-Compatibility-Test
          path: kernel/out/arch/arm64/boot/Image.gz
