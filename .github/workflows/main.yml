name: Redmi 9A - Inspect Original Boot

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binwalk \
            file \
            xz-utils \
            gzip \
            cpio \
            lz4 \
            zstd \
            unzip \
            python3 \
            python3-pip

      - name: Check repository
        run: |
          echo "===== REPOSITORY FILES ====="
          find . -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Locate boot image
        run: |
          echo "===== SEARCHING FOR BOOT.IMG ====="

          BOOT=""

          for f in \
            ./boot.img \
            ./files/boot.img \
            ./images/boot.img \
            ./input/boot.img
          do
            if [ -f "$f" ]; then
              BOOT="$f"
              break
            fi
          done

          if [ -z "$BOOT" ]; then
            echo "ERROR: boot.img is not present in GitHub repository."
            echo
            echo "IMPORTANT:"
            echo "GitHub repository does not automatically receive files"
            echo "uploaded to this ChatGPT conversation."
            echo
            echo "Put your boot.img in the repository or use Git LFS."
            exit 1
          fi

          echo "BOOT_IMAGE=$BOOT" >> "$GITHUB_ENV"
          echo "Found: $BOOT"

      - name: Verify boot image
        run: |
          echo "===== BOOT IMAGE ====="
          file "$BOOT_IMAGE"

          echo
          echo "===== SIZE ====="
          ls -lh "$BOOT_IMAGE"

          echo
          echo "===== HEADER ====="
          xxd -l 64 "$BOOT_IMAGE"

      - name: Extract Android boot image
        run: |
          mkdir -p extracted

          python3 - <<'PY'
          import struct

          boot = open("$BOOT_IMAGE", "rb").read()

          if boot[:8] != b"ANDROID!":
              raise SystemExit("ERROR: Invalid Android boot image")

          print("ANDROID boot header: OK")

          kernel_size, kernel_addr = struct.unpack_from("<II", boot, 8)
          ramdisk_size, ramdisk_addr = struct.unpack_from("<II", boot, 16)
          second_size, second_addr = struct.unpack_from("<II", boot, 24)
          tags_addr, page_size = struct.unpack_from("<II", boot, 32)

          print("Kernel size :", kernel_size)
          print("Ramdisk size:", ramdisk_size)
          print("Second size :", second_size)
          print("Page size   :", page_size)

          def align(x, p):
              return ((x + p - 1) // p) * p

          offset = page_size

          kernel = boot[offset:offset + kernel_size]
          offset += align(kernel_size, page_size)

          ramdisk = boot[offset:offset + ramdisk_size]

          open("extracted/kernel.bin", "wb").write(kernel)
          open("extracted/ramdisk.bin", "wb").write(ramdisk)

          print("Kernel extracted:", len(kernel))
          print("Ramdisk extracted:", len(ramdisk))
          PY

      - name: Inspect kernel
        run: |
          echo "===== KERNEL FILE ====="
          file extracted/kernel.bin

          echo
          echo "===== KERNEL STRINGS ====="

          strings -a extracted/kernel.bin > extracted/kernel.strings

          grep -Ei \
            'Linux version|4\.19|4\.9|clang|gcc|dandelion|blossom|angelica|redmi' \
            extracted/kernel.strings \
            | head -100 || true

      - name: Search kernel config
        run: |
          echo "===== CONFIG SEARCH ====="

          strings -a extracted/kernel.bin \
            | grep -E \
              'CONFIG_[A-Z0-9_]+=|IKCONFIG|KSU|KERNELSU' \
            | head -200 \
            > extracted/config-results.txt || true

          cat extracted/config-results.txt

      - name: Kernel compression detection
        run: |
          echo "===== COMPRESSION / FORMAT ====="

          file extracted/kernel.bin

          echo
          echo "Magic bytes:"
          xxd -l 32 extracted/kernel.bin

      - name: Hash kernel
        run: |
          echo "===== HASHES ====="

          sha256sum extracted/kernel.bin
          sha256sum "$BOOT_IMAGE"

      - name: Create report
        run: |
          {
            echo "===== ORIGINAL BOOT INSPECTION ====="
            echo
            echo "Boot image:"
            file "$BOOT_IMAGE"
            ls -lh "$BOOT_IMAGE"

            echo
            echo "Kernel:"
            file extracted/kernel.bin
            ls -lh extracted/kernel.bin

            echo
            echo "===== KERNEL VERSION / BUILD ====="
            grep -Ei \
              'Linux version|4\.19|4\.9|clang|gcc|dandelion|blossom|angelica|redmi' \
              extracted/kernel.strings \
              | head -100 || true

            echo
            echo "===== KERNELSU / CONFIG ====="
            cat extracted/config-results.txt

            echo
            echo "===== HASH ====="
            sha256sum extracted/kernel.bin
            sha256sum "$BOOT_IMAGE"

          } > extracted/REPORT.txt

          cat extracted/REPORT.txt

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-boot-inspection
          path: extracted/
