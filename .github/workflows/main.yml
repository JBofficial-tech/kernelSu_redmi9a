name: Redmi 9A KernelSU Final Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git curl jq bc bison flex \
            build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            python3 \
            rsync \
            cpio \
            unzip \
            gzip \
            file \
            device-tree-compiler

      # =========================================================
      # KERNEL SOURCE
      # =========================================================

      - name: Clone kernel source
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

          test -f kernel/Makefile

      - name: Check kernel
        working-directory: kernel
        run: |
          set -e

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo
          echo "===== KERNEL COMMIT ====="
          git log -1 --oneline

      # =========================================================
      # DEFCONFIG
      # =========================================================

      - name: Find defconfig
        working-directory: kernel
        run: |
          set -e

          echo "===== DEFCONFIG SEARCH ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | grep -Ei \
              'angelica|dandelion|blossom|mt6765' \
            || true

          CONFIG=""

          for cfg in \
            angelica_defconfig \
            dandelion_defconfig \
            blossom_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Redmi 9A defconfig not found."
            exit 1
          fi

          echo "Using defconfig: $CONFIG"

          echo "KERNEL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Generate kernel config
        working-directory: kernel
        run: |
          set -e

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

      # =========================================================
      # KERNELSU 0.9.5
      # =========================================================

      - name: Install KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e

          echo "===== KERNELSU v0.9.5 ====="

          curl -L --fail \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh \
            -o /tmp/setup-ksu.sh

          chmod +x /tmp/setup-ksu.sh

          # IMPORTANT:
          # Explicitly use v0.9.5.
          /tmp/setup-ksu.sh v0.9.5

          test -d drivers/kernelsu

          echo
          echo "===== KSU SOURCE ====="
          ls -la drivers/kernelsu

      # =========================================================
      # VERIFY KSU
      # =========================================================

      - name: Verify KernelSU integration
        working-directory: kernel
        run: |
          set -e

          echo "===== KSU KCONFIG ====="

          grep -n -A20 -B5 \
            '^config KSU' \
            drivers/kernelsu/Kconfig || true

          echo
          echo "===== KSU DRIVER ENTRY ====="

          grep -n \
            'drivers/kernelsu/Kconfig' \
            drivers/Kconfig || true

      # =========================================================
      # ENABLE MODULES + KPROBES
      # =========================================================

      - name: Enable KPROBES requirements
        working-directory: kernel
        run: |
          set -e

          echo "===== ENABLE KPROBES ====="

          # KPROBES in this kernel requires MODULES.
          ./scripts/config \
            --file out/.config \
            --enable MODULES

          ./scripts/config \
            --file out/.config \
            --enable KPROBES

          ./scripts/config \
            --file out/.config \
            --enable KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable KALLSYMS

          ./scripts/config \
            --file out/.config \
            --enable EXT4_FS

          echo
          echo "===== BEFORE OLDDEFCONFIG ====="

          ./scripts/config --file out/.config --state MODULES
          ./scripts/config --file out/.config --state KPROBES
          ./scripts/config --file out/.config --state KPROBE_EVENTS
          ./scripts/config --file out/.config --state KALLSYMS
          ./scripts/config --file out/.config --state EXT4_FS

      - name: Apply olddefconfig
        working-directory: kernel
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      # =========================================================
      # ENABLE KSU
      # =========================================================

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          set -e

          echo "===== ENABLE KSU ====="

          ./scripts/config \
            --file out/.config \
            --enable MODULES

          ./scripts/config \
            --file out/.config \
            --enable KPROBES

          ./scripts/config \
            --file out/.config \
            --enable KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable KALLSYMS

          ./scripts/config \
            --file out/.config \
            --enable EXT4_FS

          ./scripts/config \
            --file out/.config \
            --enable KSU

          echo
          echo "===== CONFIG BEFORE FINAL CHECK ====="

          grep -E \
            '^CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KALLSYMS|EXT4_FS|KSU)=' \
            out/.config || true

      # =========================================================
      # FINAL CONFIG
      # =========================================================

      - name: Finalize and verify KSU config
        working-directory: kernel
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "===== FINAL KSU CONFIG ====="

          grep -E \
            '^CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KALLSYMS|EXT4_FS|KSU)=' \
            out/.config || true

          if ! grep -q '^CONFIG_MODULES=y' out/.config; then
            echo "ERROR: CONFIG_MODULES=y missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_KPROBES=y' out/.config; then
            echo "ERROR: CONFIG_KPROBES=y missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "ERROR: CONFIG_KSU=y missing"
            exit 1
          fi

          echo
          echo "======================================"
          echo " MODULES = y"
          echo " KPROBES = y"
          echo " KSU     = y"
          echo " CONFIGURATION SUCCESS"
          echo "======================================"

      # =========================================================
      # BUILD KERNEL
      # =========================================================

      - name: Build KernelSU kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "===== BUILD KERNEL ====="

          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz

      - name: Verify kernel
        working-directory: kernel
        run: |
          set -e

          test -s out/arch/arm64/boot/Image.gz

          echo "===== KERNEL BUILD SUCCESS ====="

          ls -lh \
            out/arch/arm64/boot/Image.gz

      # =========================================================
      # PREPARE
      # =========================================================

      - name: Prepare work directories
        run: |
          set -e

          rm -rf work tools output verify

          mkdir -p \
            work \
            tools \
            output \
            verify

      # =========================================================
      # DOWNLOAD YOUR 64 MB BOOT.IMG
      # =========================================================

      - name: Download original boot.img
        run: |
          set -e

          echo "===== DOWNLOAD ORIGINAL BOOT ====="

          API="https://api.github.com/repos/JBofficial-tech/kernelSu_redmi9a/releases/latest"

          RELEASE=$(curl -fsSL "$API")

          echo "Release:"
          echo "$RELEASE" | jq -r '.tag_name'

          BOOT_URL=$(echo "$RELEASE" \
            | jq -r '
                .assets[]
                | select(.name=="boot.img")
                | .browser_download_url
              ' \
            | head -1)

          if [ -z "$BOOT_URL" ] || [ "$BOOT_URL" = "null" ]; then
            echo "ERROR: boot.img not found."
            exit 1
          fi

          echo "Downloading boot.img..."

          curl -L \
            --fail \
            --retry 3 \
            "$BOOT_URL" \
            -o work/boot.img

          test -s work/boot.img

          echo
          echo "===== ORIGINAL BOOT ====="

          ls -lh work/boot.img
          file work/boot.img
          sha256sum work/boot.img

      # =========================================================
      # PREPARE KERNEL
      # =========================================================

      - name: Prepare KernelSU Image
        run: |
          set -e

          test -s \
            kernel/out/arch/arm64/boot/Image.gz

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            work/Image.gz

          gzip -dc \
            work/Image.gz \
            > work/Image

          test -s work/Image

          echo "===== NEW KERNEL ====="

          ls -lh \
            work/Image.gz \
            work/Image

          file work/Image

      # =========================================================
      # MAGISKBOOT
      # =========================================================

      - name: Download Magisk
        run: |
          set -e

          curl -fsSL \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            -o /tmp/magisk.json

          echo "===== MAGISK RELEASE ====="

          jq -r '.tag_name' /tmp/magisk.json

          URL=$(jq -r '
            .assets[]
            | select(.name | test("^Magisk-v.*\\.apk$"))
            | .browser_download_url
          ' /tmp/magisk.json | head -1)

          test -n "$URL"

          curl -L \
            --fail \
            "$URL" \
            -o tools/Magisk.apk

      - name: Extract magiskboot
        run: |
          set -e

          unzip -j -o \
            tools/Magisk.apk \
            'lib/x86_64/libmagiskboot.so' \
            -d tools

          mv \
            tools/libmagiskboot.so \
            tools/magiskboot

          chmod +x tools/magiskboot

          test -s tools/magiskboot

          echo "===== MAGISKBOOT ====="

          file tools/magiskboot

      # =========================================================
      # UNPACK BOOT
      # =========================================================

      - name: Unpack boot.img
        working-directory: work
        run: |
          set -e

          echo "===== UNPACK BOOT ====="

          ../tools/magiskboot \
            unpack \
            boot.img

          test -s kernel

          echo
          echo "===== UNPACKED BOOT ====="

          ls -lah

      # =========================================================
      # REPLACE KERNEL
      # =========================================================

      - name: Replace boot kernel
        working-directory: work
        run: |
          set -e

          cp \
            kernel \
            original-kernel

          echo "===== ORIGINAL KERNEL ====="

          file original-kernel
          ls -lh original-kernel

          echo
          echo "===== REPLACING KERNEL ====="

          cp \
            Image \
            kernel

          test -s kernel

          echo
          echo "===== NEW BOOT KERNEL ====="

          file kernel
          ls -lh kernel

      # =========================================================
      # REPACK
      # =========================================================

      - name: Repack KernelSU boot.img
        working-directory: work
        run: |
          set -e

          echo "===== REPACK BOOT ====="

          ../tools/magiskboot \
            repack \
            boot.img \
            boot-KSU.img

          test -s boot-KSU.img

          echo
          echo "===== REPACK SUCCESS ====="

          ls -lh boot-KSU.img
          file boot-KSU.img
          sha256sum boot-KSU.img

      # =========================================================
      # FINAL VERIFICATION
      # =========================================================

      - name: Verify final boot image
        run: |
          set -e

          echo "===== VERIFY FINAL BOOT ====="

          cp \
            work/boot-KSU.img \
            verify/boot-KSU.img

          cd verify

          ../tools/magiskboot \
            unpack \
            boot-KSU.img

          test -s kernel

          echo
          echo "===== FINAL BOOT VERIFIED ====="

          ls -lh boot-KSU.img
          ls -lh kernel

          file kernel
          sha256sum kernel

      # =========================================================
      # FINAL ARTIFACT
      # =========================================================

      - name: Prepare final files
        run: |
          set -e

          cp \
            work/boot-KSU.img \
            output/Redmi9A-KernelSU-boot.img

          cp \
            work/boot.img \
            output/original-boot.img

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            output/KernelSU-Image.gz

          cp \
            kernel/out/.config \
            output/kernel-config

          sha256sum \
            output/Redmi9A-KernelSU-boot.img \
            output/original-boot.img \
            output/KernelSU-Image.gz \
            > output/SHA256SUMS.txt

          echo \
            "Redmi 9A KernelSU v0.9.5 final boot image." \
            > output/BUILD_SUCCESS.txt

          echo
          echo "======================================"
          echo " FINAL OUTPUT"
          echo "======================================"

          ls -lh output

      # =========================================================
      # UPLOAD
      # =========================================================

      - name: Upload final KernelSU boot
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU-v0.9.5-Final
          path: output/
