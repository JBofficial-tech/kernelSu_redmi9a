name: Redmi 9A KernelSU Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            libssl-dev libelf-dev \
            python3 zip unzip cpio \
            rsync wget curl

      - name: Clone KernelSU-Next
        run: |
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

      - name: Clone candidate Blossom kernel
        run: |
          git clone --depth=1 \
            https://github.com/zyexro/sashimi_kernel_xiaomi_blossom.git \
            kernel

      - name: Show kernel version
        working-directory: kernel
        run: |
          make kernelversion
          head -40 Makefile

      - name: Stop if kernel is not 4.19
        working-directory: kernel
        run: |
          VERSION=$(make kernelversion)
          echo "Detected kernel: $VERSION"
          case "$VERSION" in
            4.19.*) ;;
            *) echo "ERROR: Kernel is not 4.19.x"; exit 1 ;;
          esac

      - name: Integrate KernelSU-Next
        working-directory: kernel
        run: |
          ../KernelSU-Next/kernel/setup.sh

      - name: Prepare config
        working-directory: kernel
        run: |
          if [ -f arch/arm64/configs/dandelion_defconfig ]; then
            make O=out ARCH=arm64 dandelion_defconfig
          elif [ -f arch/arm64/configs/blossom_defconfig ]; then
            make O=out ARCH=arm64 blossom_defconfig
          elif [ -f arch/arm64/configs/angelican_defconfig ]; then
            make O=out ARCH=arm64 angelican_defconfig
          else
            echo "ERROR: No Redmi 9A/Blossom defconfig found"
            exit 1
          fi

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          ./scripts/config --file out/.config \
            --enable CONFIG_KSU
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz

      - name: Collect kernel
        run: |
          mkdir -p output

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb output/
          fi

          cp kernel/out/.config output/kernel-config

          echo "===== OUTPUT ====="
          ls -lah output

      - name: Package artifact
        run: |
          cd output
          zip -r ../redmi9a-kernelsu.zip .
          cd ..

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU
          path: |
            redmi9a-kernelsu.zip
            output/
