name: Redmi 9A - KernelSU Build and Boot Repack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            jq \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            python3 \
            rsync \
            cpio \
            device-tree-compiler \
            unzip

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

      - name: Verify kernel source
        working-directory: kernel
        run: |
          test -f Makefile
          test -d arch
          test -d drivers
          test -d include

          echo "===== KERNEL VERSION ====="
          make kernelversion

          echo
          echo "===== KERNEL COMMIT ====="
          git log -1 --oneline

      - name: Find device defconfig
        working-directory: kernel
        run: |
          echo "===== AVAILABLE DEVICE CONFIGS ====="

          find arch/arm64/configs \
            -type f \
            | grep -Ei 'blossom|dandelion|mt6765' \
            | head -100 || true

          CONFIG=""

          for cfg in \
            blossom_defconfig \
            dandelion_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Redmi 9A defconfig not found."
            exit 1
          fi

          echo "Using: $CONFIG"
          echo "KERNEL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$KERNEL_CONFIG"

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          echo "===== KERNELSU v0.9.5 ====="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

      - name: Verify KernelSU integration
        working-directory: kernel
        run: |
          echo "===== KSU SOURCE ====="

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu not found."
            exit 1
          fi

          echo "drivers/kernelsu exists."

          echo
          echo "===== KSU KCONFIG ====="
          grep -R -n '^config KSU' drivers/kernelsu || true

          echo
          echo "===== DRIVERS KCONFIG ====="
          grep -n 'drivers/kernelsu/Kconfig' drivers/Kconfig || true

          echo
          echo "===== DRIVERS MAKEFILE ====="
          grep -n 'kernelsu' drivers/Makefile || true

      - name: Enable KernelSU requirements
        working-directory: kernel
        run: |
          echo "===== ENABLE KSU REQUIREMENTS ====="

          ./scripts/config \
            --file out/.config \
            --enable KPROBES

          ./scripts/config \
            --file out/.config \
            --enable KPROBE_EVENTS

          ./scripts/config \
            --file out/.config \
            --enable KALLSYMS

          ./scripts/config \
            --file out/.config \
            --enable EXT4_FS

          echo
          echo "===== BEFORE OLDDEFCONFIG ====="

          grep -E \
            '^CONFIG_(KPROBES|KPROBE_EVENTS|KALLSYMS|EXT4_FS)=' \
            out/.config || true

      - name: Regenerate kernel config
        working-directory: kernel
        run: |
          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      - name: Verify KernelSU configuration
        working-directory: kernel
        run: |
          echo "===== FINAL KSU CONFIG ====="

          grep -E \
            '^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KALLSYMS|EXT4_FS)=' \
            out/.config || true

          if grep -q '^CONFIG_KSU=y' out/.config; then
            echo
            echo "===================================="
            echo " CONFIG_KSU=y SUCCESS"
            echo "===================================="
          else
            echo
            echo "ERROR: CONFIG_KSU is not enabled."
            echo
            echo "===== KSU KCONFIG ====="
            cat drivers/kernelsu/Kconfig || true
            exit 1
          fi

      - name: Build KernelSU kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz

      - name: Verify kernel build
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "ERROR: Image.gz was not created."
            exit 1
          fi

          echo "===== KERNEL BUILD SUCCESS ====="
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== KERNEL VERSION ====="
          make O=out ARCH=arm64 kernelversion

      - name: Create work directory
        run: |
          mkdir -p work
          mkdir -p tools

      - name: Download original boot.img
        run: |
          echo "===== FINDING LATEST RELEASE ====="

          API="https://api.github.com/repos/JBofficial-tech/kernelSu_redmi9a/releases/latest"

          RELEASE_INFO=$(curl -fsSL "$API")

          echo "$RELEASE_INFO" \
            | jq -r '.name, .tag_name'

          BOOT_URL=$(echo "$RELEASE_INFO" \
            | jq -r '.assets[] | select(.name == "boot.img") | .browser_download_url' \
            | head -1)

          if [ -z "$BOOT_URL" ] || [ "$BOOT_URL" = "null" ]; then
            echo "ERROR: boot.img was not found in latest release."

            echo
            echo "Available assets:"
            echo "$RELEASE_INFO" \
              | jq -r '.assets[].name'

            exit 1
          fi

          echo
          echo "Downloading boot.img..."

          curl -L \
            --fail \
            --retry 3 \
            "$BOOT_URL" \
            -o work/boot.img

          test -f work/boot.img

          echo
          echo "===== ORIGINAL BOOT ====="
          ls -lh work/boot.img
          file work/boot.img
          sha256sum work/boot.img

      - name: Copy KernelSU kernel
        run: |
          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            work/Image.gz

          echo "===== KSU KERNEL ====="
          ls -lh work/Image
