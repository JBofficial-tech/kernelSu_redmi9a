name: Redmi 9A KernelSU Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            libssl-dev libelf-dev libncurses5-dev \
            python3 rsync cpio zip unzip wget curl \
            lzop device-tree-compiler

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/zyexro/sashimi_kernel_xiaomi_blossom.git \
            kernel

      - name: Check kernel source
        working-directory: kernel
        run: |
          echo "===== Kernel version ====="
          make kernelversion

          echo "===== Source revision ====="
          git log -1 --oneline

      - name: Install Android Clang 11
        run: |
          mkdir -p "$HOME/clang"

          wget -q \
            https://github.com/termux/termux-packages/releases/download/clang-11.0.1/clang-11.0.1-aarch64-linux-android.tar.xz \
            -O "$HOME/clang.tar.xz"

          tar -xf "$HOME/clang.tar.xz" \
            -C "$HOME/clang"

          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Verify compiler
        run: |
          which clang
          clang --version
          which ld.lld
          ld.lld --version

      - name: Find defconfig
        working-directory: kernel
        run: |
          echo "===== Redmi/MT6765 configs ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -iname "*dandelion*" \
              -o -iname "*blossom*" \
              -o -iname "*angelican*" \
              -o -iname "*mt6765*" \
            \) \
            -print

      - name: Prepare config
        working-directory: kernel
        run: |
          mkdir -p out

          if [ -f arch/arm64/configs/dandelion_defconfig ]; then
            make O=out ARCH=arm64 dandelion_defconfig

          elif [ -f arch/arm64/configs/blossom_defconfig ]; then
            make O=out ARCH=arm64 blossom_defconfig

          elif [ -f arch/arm64/configs/angelican_defconfig ]; then
            make O=out ARCH=arm64 angelican_defconfig

          else
            echo "ERROR: No suitable defconfig found."
            exit 1
          fi

      - name: Clone KernelSU Next
        run: |
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

      - name: Integrate KernelSU
        working-directory: kernel
        run: |
          ../KernelSU-Next/kernel/setup.sh

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          make O=out ARCH=arm64 olddefconfig

          grep CONFIG_KSU out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            Image.gz

      - name: Collect output
        run: |
          mkdir -p output

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz output/
          fi

          cp kernel/out/.config output/kernel-config

          echo "===== OUTPUT ====="
          ls -lah output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU
          path: output/
