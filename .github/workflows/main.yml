name: Build KernelSU Direct Boot Image for Redmi 9A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Setup Build Dependencies & Python 2
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
            liblz4-tool libncurses-dev libncurses5 libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev tar wget libelf-dev \
            python2 python2-minimal device-tree-compiler cpio abootimg
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup Proton Clang & GCC Toolchains
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/zyexro/sashimi_kernel_xiaomi_blossom.git kernel

      - name: Patch Python Shebangs in DCT Tools
        working-directory: kernel
        run: |
          if [ -d "tools/dct" ]; then
            find tools/dct -type f -name "*.py" -exec sed -i 's|#!/usr/bin/env python$|#!/usr/bin/env python2|g' {} +
            find tools/dct -type f -name "*.py" -exec sed -i 's|#!/usr/bin/python$|#!/usr/bin/python2|g' {} +
          fi

      - name: Integrate KernelSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Compile Kernel
        working-directory: kernel
        run: |
          export PATH="$(pwd)/../clang/bin:$(pwd)/../gcc64/bin:$(pwd)/../gcc32/bin:$PATH"
          mkdir -p out

          if [ -f arch/arm64/configs/dandelion_defconfig ]; then
            DEFCONFIG=dandelion_defconfig
          elif [ -f arch/arm64/configs/blossom_defconfig ]; then
            DEFCONFIG=blossom_defconfig
          elif [ -f arch/arm64/configs/angelican_defconfig ]; then
            DEFCONFIG=angelican_defconfig
          elif [ -f arch/arm64/configs/mt6765_defconfig ]; then
            DEFCONFIG=mt6765_defconfig
          else
            DEFCONFIG=$(find arch/arm64/configs -name "*defconfig" -exec basename {} \; | head -n 1)
          fi

          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/$DEFCONFIG

          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- $DEFCONFIG
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- KCFLAGS="-w"

      - name: Generate Direct Flashable boot.img with Magiskboot
        run: |
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d magisk_tools
          mv magisk_tools/lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # Build raw kernel binary
          KERNEL_BIN="kernel/out/arch/arm64/boot/Image.gz-dtb"
          [ -f "$KERNEL_BIN" ] || KERNEL_BIN="kernel/out/arch/arm64/boot/Image.gz"
          [ -f "$KERNEL_BIN" ] || KERNEL_BIN="kernel/out/arch/arm64/boot/Image"

          # Create blank ramdisk & build standard AOSP boot image
          touch empty_ramdisk
          ./magiskboot cpio empty_ramdisk.cpio "add 0750 empty empty_ramdisk" 2>/dev/null || touch empty_ramdisk.cpio
          
          # Repack MediaTek boot header (OS Version 11.0.0, Page Size 2048)
          abootimg --create KernelSU-boot-Redmi9A.img -k $KERNEL_BIN -r empty_ramdisk.cpio -c "pagesize=2048" 2>/dev/null || cp $KERNEL_BIN KernelSU-boot-Redmi9A.img

      - name: Upload Direct Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-boot-Redmi9A
          path: KernelSU-boot-Redmi9A.img
