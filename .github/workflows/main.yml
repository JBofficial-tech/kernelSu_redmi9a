name: Redmi 9A - KernelSU Boot Repack

on:
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download original boot.img
        run: |
          mkdir -p work

          curl -L --fail --retry 3 \
            "https://github.com/JBofficial-tech/kernelSu_redmi9a/releases/download/v1.0/boot.img" \
            -o work/boot.img

          echo "===== ORIGINAL BOOT ====="
          ls -lh work/boot.img
          file work/boot.img
          sha256sum work/boot.img

      - name: Download KernelSU build
        uses: actions/download-artifact@v4
        with:
          name: Redmi9A-KernelSU-v0.9.5
          path: work/ksu

      - name: Locate kernel
        run: |
          echo "===== KSU ARTIFACT ====="
          find work/ksu -type f -maxdepth 3 -print

          KERNEL=""

          for f in \
            work/ksu/Image.gz \
            work/ksu/Image \
            work/ksu/kernel/Image.gz \
            work/ksu/kernel/Image
          do
            if [ -f "$f" ]; then
              KERNEL="$f"
              break
            fi
          done

          if [ -z "$KERNEL" ]; then
            echo "ERROR: Kernel image not found."
            exit 1
          fi

          cp "$KERNEL" work/Image.gz

          echo "Using kernel:"
          ls -lh work/Image.gz

      - name: Download magiskboot
        run: |
          mkdir -p tools

          curl -L --fail \
            "https://github.com/topjohnwu/Magisk/raw/master/scripts/magiskboot" \
            -o tools/magiskboot

          chmod +x tools/magiskboot

          ./tools/magiskboot --help

      - name: Unpack original boot
        working-directory: work
        run: |
          ../tools/magiskboot unpack boot.img

          echo "===== UNPACKED FILES ====="
          ls -lah

          echo
          echo "===== KERNEL ====="
          file kernel || true
          ls -lh kernel || true

          echo
          echo "===== RAMDISK ====="
          file ramdisk.cpio* || true

      - name: Save original kernel
        working-directory: work
        run: |
          if [ -f kernel ]; then
            cp kernel original-kernel
            echo "Original kernel saved."
          else
            echo "ERROR: magiskboot did not extract kernel."
            exit 1
          fi

      - name: Replace kernel
        working-directory: work
        run: |
          echo "===== REPLACING KERNEL ====="

          cp Image.gz kernel

          echo "New kernel:"
          ls -lh kernel
          file kernel

      - name: Repack boot image
        working-directory: work
        run: |
          echo "===== REPACKING ====="

          ../tools/magiskboot repack boot.img new-boot.img

          test -f new-boot.img

          echo
          echo "===== NEW BOOT ====="
          ls -lh new-boot.img
          file new-boot.img
          sha256sum new-boot.img

      - name: Test new boot image
        working-directory: work
        run: |
          echo "===== TESTING REPACKED IMAGE ====="

          ../tools/magiskboot unpack new-boot.img

          echo
          echo "===== REPACK RESULT ====="
          ls -lh

          test -f kernel

          echo
          echo "Repacked boot image is structurally readable."

      - name: Prepare final artifact
        run: |
          mkdir -p output

          cp work/new-boot.img \
            output/boot-KernelSU-v0.9.5.img

          cp work/boot.img \
            output/original-boot.img

          sha256sum \
            output/boot-KernelSU-v0.9.5.img \
            > output/SHA256SUMS.txt

          echo "KernelSU v0.9.5 boot image repack completed." \
            > output/BUILD_SUCCESS.txt

          echo
          echo "===== FINAL OUTPUT ====="
          ls -lh output

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-KernelSU-Boot
          path: output/
