- name: Install AOSP Clang toolchain
        run: |
          set -e

          mkdir -p "$HOME/toolchains"

          wget -q --show-progress \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz" \
            -O "$HOME/clang.tar.gz"

          mkdir -p "$HOME/toolchains/clang-r416183b"

          tar -xzf "$HOME/clang.tar.gz" \
            -C "$HOME/toolchains/clang-r416183b"

          echo "$HOME/toolchains/clang-r416183b/clang-r416183b/bin" >> "$GITHUB_PATH"

          echo "===== CLANG ====="
          "$HOME/toolchains/clang-r416183b/clang-r416183b/bin/clang" --version
