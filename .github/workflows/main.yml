- name: Package Flashable AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          
          # Copy compiled kernel
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz ak3/Image.gz
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image ak3/Image
          fi

          cd ak3
          cat << 'EOF' > anykernel.sh
          properties() { '
          kernel.string=KernelSU for Redmi 9A by Tech Mind
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          # Exact physical partition for dandelion / blossom
          block=/dev/block/mmcblk0p33;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          chmod -R 755 tools/ *.sh
          zip -r9 ../KernelSU-Redmi9A-Flashable.zip ./* -x .git README.md

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Redmi9A-Flashable
          path: KernelSU-Redmi9A-Flashable.zip
