name: Redmi9A KPROBES Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 rsync cpio

      - name: Clone kernel
        run: |
          git clone --depth=1 \
            https://github.com/TelegramAt25/niigo_kernel_xiaomi_blossom.git \
            kernel

      - name: Find defconfig
        working-directory: kernel
        run: |
          find arch/arm64/configs \
            -type f \
            | grep -Ei 'blossom|dandelion|mt6765' \
            | head -100

          CONFIG=""

          for cfg in \
            blossom_defconfig \
            dandelion_defconfig \
            mt6765_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              CONFIG="$cfg"
              break
            fi
          done

          test -n "$CONFIG"

          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Generate config
        working-directory: kernel
        run: |
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$CONFIG"

      - name: Inspect KPROBES
        working-directory: kernel
        run: |
          echo "===== KPROBE DEFINITIONS ====="

          grep -R -n \
            'config KPROBES' \
            kernel arch include drivers \
            2>/dev/null | head -30 || true

          echo
          echo "===== HAVE_KPROBES ====="

          grep -R -n \
            'config HAVE_KPROBES' \
            arch include kernel drivers \
            2>/dev/null | head -30 || true

          echo
          echo "===== CURRENT CONFIG ====="

          grep -E \
            '^CONFIG_(KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=' \
            out/.config || true

      - name: Inspect dependencies
        working-directory: kernel
        run: |
          echo "===== KPROBE SOURCE ====="

          grep -R -n \
            -B8 -A20 \
            'config KPROBES' \
            arch include kernel drivers \
            2>/dev/null | head -100 || true

          echo
          echo "===== ARCH KPROBE SUPPORT ====="

          grep -R -n \
            'HAVE_KPROBES' \
            arch/arm64 \
            2>/dev/null | head -100 || true

          echo
          echo "===== KPROBE MAKEFILE ====="

          grep -R -n \
            'kprobes' \
            kernel/Kconfig* \
            arch/arm64/Kconfig* \
            arch/arm64/Makefile \
            2>/dev/null | head -100 || true

      - name: Test KPROBES with olddefconfig
        working-directory: kernel
        run: |
          echo "===== TRY ENABLE KPROBES ====="

          ./scripts/config \
            --file out/.config \
            --enable KPROBES

          echo
          echo "Before olddefconfig:"

          ./scripts/config \
            --file out/.config \
            --state KPROBES || true

          grep '^CONFIG_KPROBES' out/.config || true

          echo
          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "After olddefconfig:"

          ./scripts/config \
            --file out/.config \
            --state KPROBES || true

          grep -E \
            '^CONFIG_(KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=' \
            out/.config || true
