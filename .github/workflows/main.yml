name: Redmi 9A 4.19 KernelSU Check

'on':
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang-11 lld-11 llvm-11 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            libncurses5-dev libncurses-dev \
            python3 rsync cpio unzip zip \
            wget curl xz-utils

      - name: Show compiler
        run: |
          clang-11 --version
          ld.lld-11 --version
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone candidate kernel tree
        run: |
          git clone --depth=1 \
            https://github.com/droidian-mt6765/kernel-xiaomi-mt6765.git \
            kernel

      - name: Inspect kernel tree
        working-directory: kernel
        run: |
          echo "===== COMMIT ====="
          git log -1 --oneline

          echo "===== KERNEL VERSION ====="
          make kernelversion || true

          echo "===== MAKEFILE VERSION ====="
          grep -m1 -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile || true

          echo "===== ARM64 CONFIGS ====="
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -print | head -100

      - name: Find Redmi 9A configs
        working-directory: kernel
        run: |
          echo "===== DANDELION/BLOSSOM CONFIG SEARCH ====="

          grep -RilE \
            'dandelion|blossom|mt6765' \
            arch/arm64/configs \
            2>/dev/null || true

      - name: Check KernelSU compatibility
        run: |
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

          echo "===== KERNELSU VERSION ====="
          cd KernelSU-Next
          git describe --tags --always || true

      - name: Check source compatibility
        working-directory: kernel
        run: |
          echo "===== FINAL SOURCE REPORT ====="

          echo "Kernel version:"
          make kernelversion || true

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Architecture:"
          grep -E '^CONFIG_ARM64=' \
            arch/arm64/configs/* 2>/dev/null | head -20 || true

          echo
          echo "KernelSU driver compatibility:"
          if [ -d ../KernelSU-Next/kernel ]; then
            echo "KernelSU-Next driver available"
          else
            echo "KernelSU-Next driver NOT found"
          fi

      - name: Upload source report
        run: |
          mkdir -p report

          cd kernel

          {
            echo "===== GIT ====="
            git log -1 --oneline

            echo
            echo "===== KERNEL VERSION ====="
            make kernelversion || true

            echo
            echo "===== CONFIGS ====="
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -print
          } > ../report/source-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Redmi9A-source-report
          path: report/source-report.txt
